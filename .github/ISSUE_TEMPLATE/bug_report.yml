name: 🐛 Báo cáo lỗi (Bug Report)
description: Báo cáo sự cố hoặc hành vi không mong muốn trong Pi Decor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo cáo lỗi! Vui lòng điền thông tin chi tiết bên dưới để giúp nhóm phát triển tái hiện và khắc phục nhanh nhất.
        *Lưu ý: Nếu phát hiện lỗ hổng bảo mật, vui lòng không mở issue công khai mà thực hiện theo [SECURITY.md](https://github.com/QuocAnh19/Pi_Decor/blob/main/SECURITY.md).*

  - type: textarea
    id: description
    attributes:
      label: Mô tả chi tiết lỗi
      description: Tóm tắt rõ ràng và ngắn gọn về sự cố gặp phải.
      placeholder: Mô tả điều gì đã xảy ra...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện lỗi (Steps to Reproduce)
      description: Liệt kê chi tiết từng bước để gây ra lỗi.
      placeholder: |
        1. Truy cập vào trang '...'
        2. Nhấn vào nút '....'
        3. Cuộn xuống mục '....'
        4. Gặp thông báo lỗi '....'
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Kết quả mong muốn vs Kết quả thực tế
      description: Điều gì bạn kỳ vọng xảy ra so với điều thực tế đã xảy ra?
      placeholder: |
        - Mong muốn: Hệ thống hiển thị thông báo thành công...
        - Thực tế: Màn hình báo lỗi 500 hoặc không phản hồi...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Môi trường gặp lỗi
      description: Thông tin trình duyệt, hệ điều hành hoặc môi trường chạy.
      placeholder: "Ví dụ: Chrome 124 trên Windows 11 / Node v20.12.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Nhật ký lỗi / Ảnh chụp màn hình (Logs & Screenshots)
      description: Dán log console từ trình duyệt / terminal hoặc kéo thả ảnh chụp màn hình.
      placeholder: "Dán console error logs hoặc stack trace vào đây..."
    validations:
      required: false
