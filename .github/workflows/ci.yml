name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Checks (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Run Web Verification
        working-directory: .
        run: npm run verify:web

  api:
    name: API Checks (apps/api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pidecor
          POSTGRES_PASSWORD: pidecor_dev_only
          POSTGRES_DB: pidecor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Run API Verification
        working-directory: .
        env:
          DATABASE_URL: postgresql://pidecor:pidecor_dev_only@localhost:5432/pidecor_test
          DATABASE_URL_DIRECT: postgresql://pidecor:pidecor_dev_only@localhost:5432/pidecor_test
          DATABASE_URL_TEST: postgresql://pidecor:pidecor_dev_only@localhost:5432/pidecor_test
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long
        run: npm run verify:api

  e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [web, api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pidecor
          POSTGRES_PASSWORD: pidecor_dev_only
          POSTGRES_DB: pidecor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build Shared & Web
        run: |
          npm run build:shared
          npm run build:web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL_TEST: postgresql://pidecor:pidecor_dev_only@localhost:5432/pidecor_test
          DATABASE_URL: postgresql://pidecor:pidecor_dev_only@localhost:5432/pidecor_test
          DATABASE_URL_DIRECT: postgresql://pidecor:pidecor_dev_only@localhost:5432/pidecor_test
          JWT_SECRET: e2e_jwt_secret_key_minimum_32_characters_long
          CI: "true"
        run: npm run e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
