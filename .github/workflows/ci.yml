name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web Checks (apps/web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Run Web Verification
        working-directory: .
        run: npm run verify:web

  api:
    name: API Checks (apps/api)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pidecor
          POSTGRES_PASSWORD: pidecor_dev_only
          POSTGRES_DB: pidecor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Run API Verification
        working-directory: .
        env:
          DATABASE_URL: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          DATABASE_URL_DIRECT: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          DATABASE_URL_TEST: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long
        run: npm run verify:api

      - name: Verify Database Documentation Freshness
        working-directory: .
        env:
          DATABASE_URL: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          DATABASE_URL_DIRECT: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
        run: |
          npm run docs:db
          if ! git diff --exit-code docs/data/; then
            echo "::error::docs/data/ is out of sync with freshly migrated schema!"
            git diff --stat docs/data/
            echo "--- First 40 lines of diff ---"
            git diff docs/data/ | head -n 40
            exit 1
          fi

  e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [web, api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pidecor
          POSTGRES_PASSWORD: pidecor_dev_only
          POSTGRES_DB: pidecor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build Shared & Web
        run: |
          npm run build:shared
          npm run build:web

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL_TEST: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          DATABASE_URL: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          DATABASE_URL_DIRECT: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          JWT_SECRET: e2e_jwt_secret_key_minimum_32_characters_long
          CI: "true"
        run: npm run e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security-scans:
    name: Audits, Licenses & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Audit (Fail on High/Critical)
        run: npm run audit:prod

      - name: Check Licenses (Fail on GPL/AGPL)
        run: npm run check:licenses

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cyclonedx-sbom
          path: dist-sbom/bom.json
          retention-days: 14

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke-test:
    name: Docker Smoke Test & Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pidecor
          POSTGRES_PASSWORD: pidecor_dev_only
          POSTGRES_DB: pidecor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker Image
        run: docker build -f apps/api/Dockerfile -t pidecor-api:local .

      - name: Check Container User is Non-Root
        run: |
          CONTAINER_USER=$(docker run --rm pidecor-api:local whoami)
          if [ "$CONTAINER_USER" = "root" ]; then
            echo "LỖI: Container không được phép chạy bằng user root!"
            exit 1
          fi
          echo "Xác nhận: Container chạy bằng user '$CONTAINER_USER'"

      - name: Check No .env File Inside Image
        run: |
          docker run --rm pidecor-api:local sh -c '
            if [ -f .env ] || [ -f ../.env ] || [ -f /app/.env ] || [ -f /app/apps/api/.env ]; then
              echo "LỖI: Phát hiện file .env trong image container!"
              exit 1
            fi
            echo "Xác nhận: Không có file .env nào bên trong image"
          '

      - name: Run Container & Health Smoke Test
        run: |
          docker run -d --name api-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL="postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable" \
            -e DATABASE_URL_DIRECT="postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable" \
            -e DB_SSL=disable \
            -e JWT_SECRET=smoke_test_jwt_secret_minimum_32_characters_long \
            -e CLOUDINARY_CLOUD_NAME=mock_cloud \
            -e CLOUDINARY_API_KEY=mock_key \
            -e CLOUDINARY_API_SECRET=mock_secret \
            -e CLOUDINARY_FOLDER_PREFIX=pidecor/test \
            pidecor-api:local

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health; then
              echo "Health smoke test thành công!"
              break
            fi
            echo "Đang đợi /api/health phản hồi 200... ($i/30)"
            sleep 2
          done

          curl -fsS http://127.0.0.1:4000/api/health || (docker logs api-smoke && exit 1)
          docker stop api-smoke

      - name: Scan Image with Trivy (Fail on Critical with fixes)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: pidecor-api:local
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  backup-restore-drill:
    name: Database Backup & Restore Drill
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pidecor
          POSTGRES_PASSWORD: pidecor_dev_only
          POSTGRES_DB: pidecor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL Client Tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Backup & Restore Drill
        env:
          DATABASE_URL: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          DATABASE_URL_DIRECT: postgresql://pidecor:pidecor_dev_only@127.0.0.1:5432/pidecor_test?sslmode=disable
          RESTORE_TEST_DB_NAME: pidecor_restore_drill
        run: bash scripts/backup-restore-drill.sh

