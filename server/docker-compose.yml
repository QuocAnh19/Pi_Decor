services:
  postgres:
    image: postgres:16-alpine
    container_name: pidecor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pidecor
      POSTGRES_PASSWORD: pidecor_dev_only
      POSTGRES_DB: pidecor
    ports:
      - "5432:5432"
    volumes:
      - pidecor_pg_data:/var/lib/postgresql/data

volumes:
  pidecor_pg_data:

# ─────────────────────────────────────────────────────────────────────────
# Usage (see database/README.md §"Cài Postgres tại máy"):
#   docker compose up -d
#   # DATABASE_URL for .env:
#   #   postgresql://pidecor:pidecor_dev_only@localhost:5432/pidecor
#   npm run migrate
#   npm run seed
#   npm run dev
#
#   docker compose down        # stop, keep data
#   docker compose down -v     # stop AND wipe the volume (fresh DB next time)
#
# This is for LOCAL DEVELOPMENT ONLY — the password here is intentionally
# not secret. Production always uses Neon/Supabase (see database/README.md),
# never this container.
# ─────────────────────────────────────────────────────────────────────────
